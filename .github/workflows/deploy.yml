name: CD Pipeline (Auto Deploy)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Завантаження коду з репозиторію
        uses: actions/checkout@v4

      - name: Передача файлів на Target Node
        run: |
          # Створюємо папку для проекту та копіюємо туди всі файли. 
          # -o StrictHostKeyChecking=no ігнорує питання "yes/no" при підключенні.
          ssh -o StrictHostKeyChecking=no student@192.168.50.20 "mkdir -p ~/app-deploy"
          scp -o StrictHostKeyChecking=no -r ./* student@192.168.50.20:~/app-deploy/

      - name: Збірка та запуск Docker-контейнера
        run: |
          # Заходимо на цільову машину і виконуємо команди Докера
          ssh -o StrictHostKeyChecking=no student@192.168.50.20 << 'EOF'
            cd ~/app-deploy
            
            # Зупиняємо і видаляємо старий контейнер, якщо він працював
            docker stop task-tracker-container || true
            docker rm task-tracker-container || true
            
            # Збираємо новий образ із найсвіжішого коду
            docker build -t task-tracker-image .
            
            # Запускаємо новий контейнер (заміни порт 8000 на свій, якщо твій додаток працює на іншому)
            docker run -d --name task-tracker-container -p 8000:8000 task-tracker-image
          EOF