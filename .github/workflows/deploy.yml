name: CD Pipeline (Auto Deploy)

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Завантаження коду з репозиторію
        uses: actions/checkout@v4

      - name: Передача файлів на Target Node
        run: |
          ssh -o StrictHostKeyChecking=no student@192.168.50.20 "mkdir -p ~/app-deploy"
          scp -o StrictHostKeyChecking=no -r ./* student@192.168.50.20:~/app-deploy/

      - name: Збірка образу та налаштування Systemd + Nginx
        run: |
          ssh -o StrictHostKeyChecking=no student@192.168.50.20 << 'EOF'
            cd ~/app-deploy
            
            # 1. Збираємо новий Docker-образ
            docker build -t task-tracker-image .
            
            # 2. Створюємо системний systemd-юніт для керування контейнером
            sudo tee /etc/systemd/system/task-tracker.service << 'SYSTEMD'
[Unit]
Description=Task Tracker Docker Container
After=docker.service
Requires=docker.service

[Service]
TimeoutStartSec=0
Restart=always
ExecStartPre=-/usr/bin/docker stop task-tracker-container
ExecStartPre=-/usr/bin/docker rm task-tracker-container
ExecStart=/usr/bin/docker run --name task-tracker-container -p 5000:5000 task-tracker-image
ExecStop=/usr/bin/docker stop task-tracker-container

[Install]
WantedBy=multi-user.target
SYSTEMD

            # 3. Перезапускаємо конфігурацію systemd та вмикаємо сервіс
            sudo systemctl daemon-reload
            sudo systemctl enable task-tracker.service
            sudo systemctl restart task-tracker.service
            
            # 4. Швидке налаштування Nginx як Reverse Proxy
            sudo apt-get install nginx -y
            
            sudo tee /etc/nginx/sites-available/task-tracker << 'NGINX'
server {
    listen 8000;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
NGINX

            # Активуємо конфігурацію Nginx
            sudo ln -sf /etc/nginx/sites-available/task-tracker /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo systemctl restart nginx
          EOF

      - name: Верифікація розгортання проекту
        run: |
          echo "Запуск процесу верифікації сервісу через Nginx..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://192.168.50.20:8000/)
          echo "Отримано HTTP статус-код: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "УСПІХ: Сервіс доступний, Nginx налаштований коректно (Код 200)!"
            exit 0
          else
            echo "ПОМИЛКА: Сервіс повернув код $STATUS_CODE або недоступний!"
            exit 1
          fi