version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: tasktracker_db
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: tracker_password_123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - task_network

  web:
    build: .
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=tracker_user
      - DB_PASS=tracker_password_123
      - DB_NAME=tasktracker_db
    depends_on:
      - db
    networks:
      - task_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - task_network

networks:
  task_network:
    driver: bridge

volumes:
  db_data: